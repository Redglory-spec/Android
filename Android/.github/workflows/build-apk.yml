name: Build BotKeepStock Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug & Release APK
        run: |
          if [ -f "Android/settings.gradle.kts" ]; then
            cd Android
          fi
          gradle assembleDebug assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p dist-apk
          BASE_DIR="."
          if [ -d "Android/app" ]; then
            BASE_DIR="Android"
          fi
          cp "$BASE_DIR/app/build/outputs/apk/debug/app-debug.apk" "dist-apk/BotKeepStock-v6.1-Debug.apk"
          cp "$BASE_DIR/app/build/outputs/apk/release/app-release.apk" "dist-apk/BotKeepStock-v6.1-Release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotKeepStock-v6.1-Android-APK
          path: dist-apk/*.apk
