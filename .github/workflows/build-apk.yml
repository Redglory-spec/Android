name: Build BotKeepStock Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug & Release APK
        working-directory: Android
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist-apk
          cp Android/app/build/outputs/apk/debug/app-debug.apk dist-apk/BotKeepStock-v6.1-Debug.apk
          cp Android/app/build/outputs/apk/release/app-release.apk dist-apk/BotKeepStock-v6.1-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotKeepStock-v6.1-Android-APK
          path: dist-apk/*.apk
